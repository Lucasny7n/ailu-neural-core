[package]
name = "ailu-neural-core"
version = "0.1.0"
description = "Ailu Neural Core desktop system agent"
authors = ["Lucas"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
